<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#08090c" />
    <title>Sign in — PikuFlix</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/tokens.css" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <link rel="icon" href="/assets/logo.svg" type="image/svg+xml" />
    <style>
      .auth-shell {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: var(--sp-5);
        background: radial-gradient(
            1200px 600px at 50% -10%,
            rgba(229, 9, 20, 0.18),
            transparent 60%
          ),
          var(--bg);
      }
      .auth-card {
        width: min(420px, 100%);
        padding: var(--sp-6);
        border-radius: var(--r-lg);
        background: var(--bg-elevated);
        border: 1px solid var(--border);
        box-shadow: var(--shadow-lg);
      }
      .auth-logo {
        display: flex;
        align-items: center;
        gap: var(--sp-2);
        font-family: var(--font-display);
        font-size: 2rem;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--brand);
        margin-bottom: var(--sp-2);
      }
      .auth-logo svg {
        width: 30px;
        height: 30px;
      }
    </style>
  <script src="https://sites.super.myninja.ai/_assets/ninja-daytona-script.js"></script>
</head>
  <body>
    <main class="auth-shell">
      <div class="auth-card">
        <a class="auth-logo" href="/">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M4 2h16a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zm3 4v12l9-6-9-6z" />
          </svg>
          <span>PikuFlix</span>
        </a>
        <h1 class="modal__title" id="title">Sign in</h1>
        <p class="modal__text" id="subtitle">Welcome back to PikuFlix.</p>

        <form id="form" novalidate>
          <label class="field hidden" id="usernameField">
            <span class="field__label">Username</span>
            <input class="field__input" id="username" type="text" autocomplete="username" placeholder="cinephile" />
          </label>
          <label class="field">
            <span class="field__label">Email</span>
            <input class="field__input" id="email" type="email" autocomplete="email" placeholder="you@example.com" required />
          </label>
          <label class="field">
            <span class="field__label">Password</span>
            <input class="field__input" id="password" type="password" autocomplete="current-password" placeholder="••••••••" required minlength="8" />
          </label>
          <p class="field__error" id="error" role="alert"></p>
          <button class="btn btn--primary btn--block" id="submit" type="submit">Sign in</button>
        </form>

        <p class="text-muted" style="margin-top: var(--sp-4); font-size: var(--fs-sm); text-align: center">
          <span id="switchText">New to PikuFlix?</span>
          <button id="switchBtn" style="background:none;border:none;color:var(--brand-bright);font-weight:600;cursor:pointer">Create one</button>
        </p>
      </div>
    </main>

    <script type="module">
      import { api } from '/js/api.js';

      let mode = 'login';
      const $ = (s) => document.querySelector(s);

      function sync() {
        const signup = mode === 'signup';
        $('#title').textContent = signup ? 'Create your account' : 'Sign in';
        $('#subtitle').textContent = signup
          ? 'Join PikuFlix in seconds.'
          : 'Welcome back to PikuFlix.';
        $('#submit').textContent = signup ? 'Create account' : 'Sign in';
        $('#usernameField').classList.toggle('hidden', !signup);
        $('#switchText').textContent = signup ? 'Already have an account?' : 'New to PikuFlix?';
        $('#switchBtn').textContent = signup ? 'Sign in' : 'Create one';
        $('#error').textContent = '';
      }

      $('#switchBtn').addEventListener('click', () => {
        mode = mode === 'signup' ? 'login' : 'signup';
        sync();
      });

      $('#form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = $('#submit');
        btn.classList.add('is-loading');
        btn.disabled = true;
        $('#error').textContent = '';
        const payload = { email: $('#email').value.trim(), password: $('#password').value };
        if (mode === 'signup') payload.username = $('#username').value.trim();
        try {
          if (mode === 'signup') await api.signup(payload);
          else await api.login(payload);
          window.location.href = '/';
        } catch (err) {
          $('#error').textContent = err.message;
        } finally {
          btn.classList.remove('is-loading');
          btn.disabled = false;
        }
      });

      // If already signed in, skip straight to the app.
      api.me().then(() => (window.location.href = '/')).catch(() => {});
      sync();
    </script>
  </body>
</html>
